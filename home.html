<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page</title>

</head>
<body>
    <header>
        <div class="logo">My Portforlio</div>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!--hero section-->
    <section class="hero">
        <div class="parent">
            <h1>Welcome to My Portfolio</h1>
            <p>I am passionate web developer creating beautiful and functional websites. Let's build something amazing together!</p>
            <button class="btn">Get Started</button>
        </div>
    </section>
    <form action="get">
        <h2>Contact me</h2>
        <label for="name"></label><br>
        <input type="text" id="Name" placeholder="Enter Your Name" required><br>
        <label for="email"></label><br>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>
        <button type="submit">submit</button>
    </form>

    <footer>
        <p>&copy;2025 My Portforlio.All rights reserved</p>
    </footer>
    <style>
        
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header{
            background-color: #333;
            color: #fff;
            padding: 15px 0;
        }
        .logo{
            font-size: 24px;
            font-weight: bold;
        }
        nav{
            margin-top: 10px;
        }
        ul{
            display: flex;
            list-style: none;
            justify-content: center;
            gap: 20px;
        }
        a{
            color: #fff;
            text-decoration: none;
            transition: color 0.3ms;
        }
        a:hover{
            color: aquamarine;
        }
        .hero{
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                        url('https://via.placeholder.com/1600x600') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1{
            font-size: 48px;
            margin-bottom: 20px;
        }
        .hero p{
            font-size: 20px;
            max-width: 700px;
            margin: 0 auto 30px;
        }
        .btn{
            background-color: #f39c12;
            color: #fff;
            padding: 25px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: backround-color 0.3s;
        }
        .btn:hover{
            background-color: #d35400;
        }
        form{
            background-color: #f4f4f4;
            padding: 40px 20px;
            text-align: center;
            max-width: 600px;
            margin: auto;
            display: flex;
            flex-direction: column;
        }
        form h2{
            margin-bottom: 30px;
        }
        form button{
            align-self: center;
            width: 150px;
            padding: 25px;
            border: none;
            background-color: #d35400;
            color: #f4f4f4;
            font-size: 18px;
            cursor: pointer;
            transition: backgrpund-color 0.3s;

        }
        .button:hover{
            background-color: #f39c12;
        }
        footer{
             background-color: #333;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
        }
    
    </style>
    <!--learning git and github-->
    <!--second git practice-->
    

    
</body>
</html>
